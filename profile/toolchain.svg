<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Alp Lab toolchain: You drive the VS Code extension or the tan CLI; tan reads the build-plan from alp-sdk and produces firmware">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6bff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3c0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="400" fill="#ffffff"/>
  <rect x="8" y="8" width="1184" height="384" rx="18" fill="#ffffff" stroke="#e6e8f0" stroke-width="1.5"/>
  <rect x="8" y="8" width="12" height="384" rx="6" fill="#17205e"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">

    <text x="1150" y="372" text-anchor="end" font-size="12" font-weight="800" fill="#c3c9dc" letter-spacing="1">ALP LAB</text>

    <!-- edges -->
    <g fill="none" stroke="#2f6bff" stroke-width="2.2">
      <path d="M182,196 C205,168 210,130 232,114" marker-end="url(#ab)"/>
      <path d="M182,214 L516,214" marker-end="url(#ab)"/>
      <path d="M432,144 C480,166 515,178 558,190" marker-end="url(#ab)"/>
      <path d="M712,194 C760,166 778,124 818,108" marker-end="url(#ab)"/>
      <path d="M712,234 C760,262 778,270 818,286" marker-end="url(#ab)"/>
    </g>
    <path d="M824,126 C772,152 762,182 714,200" fill="none" stroke="#9aa3c0" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ag)"/>

    <!-- edge label chips -->
    <g font-size="11.5" font-weight="600" text-anchor="middle">
      <rect x="182" y="146" width="40" height="20" rx="10" fill="#ffffff" stroke="#dbe1f0"/><text x="202" y="160" fill="#2f6bff">GUI</text>
      <rect x="300" y="204" width="38" height="20" rx="10" fill="#ffffff" stroke="#dbe1f0"/><text x="319" y="218" fill="#2f6bff">CLI</text>
      <rect x="452" y="144" width="52" height="20" rx="10" fill="#ffffff" stroke="#dbe1f0"/><text x="478" y="158" fill="#2f6bff">shells</text>
      <rect x="742" y="128" width="52" height="20" rx="10" fill="#ffffff" stroke="#dbe1f0"/><text x="768" y="142" fill="#2f6bff">drives</text>
      <rect x="742" y="256" width="52" height="20" rx="10" fill="#ffffff" stroke="#dbe1f0"/><text x="768" y="270" fill="#2f6bff">builds</text>
      <rect x="740" y="168" width="76" height="20" rx="10" fill="#ffffff" stroke="#e2e6f0"/><text x="778" y="182" fill="#9aa3c0">build-plan</text>
    </g>

    <!-- You -->
    <rect x="42" y="176" width="140" height="72" rx="14" fill="#ffffff" stroke="#d7dcea" stroke-width="1.5"/>
    <text x="112" y="208" text-anchor="middle" font-size="18" font-weight="800" fill="#17205e">You</text>
    <text x="112" y="228" text-anchor="middle" font-size="11" fill="#6b7280">firmware developer</text>

    <!-- vscode -->
    <rect x="230" y="70" width="220" height="72" rx="14" fill="#ffffff" stroke="#d7dcea" stroke-width="1.5"/>
    <text x="340" y="102" text-anchor="middle" font-size="15" font-weight="700" fill="#17205e">alp-sdk-vscode</text>
    <text x="340" y="122" text-anchor="middle" font-size="11" fill="#6b7280">VS Code extension</text>

    <!-- tan hub -->
    <rect x="520" y="168" width="190" height="88" rx="16" fill="#2f6bff"/>
    <text x="615" y="205" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">tan</text>
    <text x="615" y="228" text-anchor="middle" font-size="11" font-weight="600" fill="#dbe6ff">build CLI · sole executor</text>

    <!-- alp-sdk -->
    <rect x="820" y="60" width="280" height="76" rx="14" fill="#ffffff" stroke="#d7dcea" stroke-width="1.5"/>
    <text x="960" y="93" text-anchor="middle" font-size="16" font-weight="700" fill="#17205e">alp-sdk</text>
    <text x="960" y="113" text-anchor="middle" font-size="11" fill="#6b7280">planner + libraries · emits build-plan</text>

    <!-- firmware -->
    <rect x="820" y="252" width="280" height="76" rx="14" fill="#ffffff" stroke="#d7dcea" stroke-width="1.5"/>
    <text x="960" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#17205e">firmware</text>
    <text x="960" y="305" text-anchor="middle" font-size="11" fill="#6b7280">Zephyr · Yocto · bare-metal</text>

  </g>
</svg>
